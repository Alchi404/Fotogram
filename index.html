<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogramm</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="fonts.css">
        <script defer src="db.js"></script>
    <script defer src="skript.js"></script>

</head>

<body onload="renderPictures(); loadIMG()">
    <header class="indexheader">
        <img src="./assets/icon/logo.svg" alt="Fotogramm logo">
    </header>
    <main class="indexmain">
        <h1>Das Chaotische Album des Desingers</h1>
        <article id="content">
        </article>
        <dialog id="full_img_dialog">
                <header>
                    <h2>Platzhalter Headline</h2>
                    <img src="./assets/icon/close.svg" alt="close icon" onclick="closeDialog()" class="close_button">
                </header>
                <main>
                    <img src="./assets/img/01_erstes_Compsit.jpg" alt="" id="full_img">
                </main>
                <footer>
                    <div class="button_wrapper" onclick="previousImg()">
                    <img src="./assets/icon/arrow.svg" alt="arrow icon" class="arrow_left">
                    </div>
                    <p id="test">1/12</p>
                    <div class="button_wrapper" onclick="nextImg()">
                    <img src="./assets/icon/arrow.svg" alt="arrow icon" class="arrow_right">
                    </div>
                </footer>
            </dialog>
    </main>
    <footer class="indexfooter">
        <img src="./assets/icon/dev_logo.svg" alt="Developer Akademie Logo">
        <p>©2023 Developer Akademie GmbH</p>
    </footer>
</body>

</html>
